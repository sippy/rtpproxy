name: RTPProxy CI

# Controls when the action will run.
on:
  # Triggers the workflow on all push or pull request events
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

# Cancels previous runs of this workflow for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'codex/') || github.ref_name == 'wip' }}

jobs:
  LoadJobs_conf:
    name: Load Jobs Settings
    uses: ./.github/workflows/.jobs_configure.yml

  MinBuild:
    name: Lean Build
    needs: LoadJobs_conf
    if: needs.LoadJobs_conf.outputs.do_MinBuild == 'true'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.os }}
      options: >-
        -v sources:/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
        --sysctl net.ipv4.ip_unprivileged_port_start=1024 --init
    env:
      COMPILER: ${{ matrix.compiler }}
      TAR_CMD: tar
      GHA_OS: ubuntu-${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [22.04]
        compiler: ['gcc-i386-cross', 'clang-i386-cross', 'gcc-mips64-cross', 'gcc-arm32-cross', 'gcc-arm64-cross', 'gcc', 'clang']
        include:
        # Stock compilers are GCC 13 and Clang 18 on Ubuntu 24.04.
        - os: 24.04
          compiler: 'gcc'
        - os: 24.04
          compiler: 'clang'
        - os: 24.04
          compiler: 'gcc-9'
        - os: 24.04
          compiler: 'gcc-10'
        - os: 24.04
          compiler: 'gcc-11'
        - os: 24.04
          compiler: 'gcc-12'
        - os: 24.04
          compiler: 'gcc-14'
        - os: 24.04
          compiler: 'clang-14'
        - os: 24.04
          compiler: 'clang-15'
        - os: 24.04
          compiler: 'clang-16'
        - os: 24.04
          compiler: 'clang-17'
        - os: 24.04
          compiler: 'clang-19'
        - os: 24.04
          compiler: 'clang-20'
        # Stock compilers are GCC 15 and Clang 21 on Ubuntu 26.04.
        - os: 26.04
          compiler: 'gcc'
        - os: 26.04
          compiler: 'clang'
        - os: 26.04
          compiler: 'gcc-11'
        - os: 26.04
          compiler: 'gcc-12'
        - os: 26.04
          compiler: 'gcc-13'
        - os: 26.04
          compiler: 'gcc-14'
        - os: 26.04
          compiler: 'gcc-16'
        - os: 26.04
          compiler: 'clang-17'
        - os: 26.04
          compiler: 'clang-18'
        - os: 26.04
          compiler: 'clang-19'
        - os: 26.04
          compiler: 'clang-20'
        - os: 26.04
          compiler: 'clang-22'

    steps:
    - name: Install git
      run: |
        apt-get update
        apt-get install -y git lsb-release gnupg2 wget

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Start Docker container
      if: endsWith(matrix.compiler, '-cross')
      run: sh -x scripts/build/start_container.sh

    - name: Cache apt-get packages
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives
        key: cleanbuild-${{ matrix.os }}-apt-get-${{ github.run_id }}
        restore-keys: |
          cleanbuild-${{ matrix.os }}-apt-get
          cleanbuild-${{ matrix.os }}-${{ matrix.compiler }}-apt-get

    - name: Install apt-get updates
      run: scripts/ft-apt-get-update.sh

    - name: install_depends
      run: sh -x scripts/build/install_depends.sh

    - name: build
      run: sh -x ./scripts/do-build.sh cleanbuild

  BuildPackages:
    name: Build Packages
    needs: [LoadJobs_conf, FullBuild]
    uses: sippy/cimagic/.github/workflows/BuildDPKGs.yml@v3
    if: ${{ !cancelled() && (success() || failure()) && needs.LoadJobs_conf.outputs.do_BuildPackages == 'true' &&
        (needs.LoadJobs_conf.outputs.do_FullBuild != 'true' || needs.FullBuild.result == 'success') }}
    with:
      apt_depends: pkg-config libssl-dev libbcg729-dev libgsm1-dev libsndfile1-dev libunwind-dev libsrtp2-dev libsystemd-dev systemd procps
      test_dpkgs_script: ./scripts/do-dpkg-test.sh
      os_versions: '["ubuntu:26.04", "ubuntu:24.04", "ubuntu:22.04", "debian:13", "debian:12", "debian:11"]'

  FullBuild:
    name: Full Build
    needs: [LoadJobs_conf, MinBuild]
    if: ${{ !cancelled() && (success() || failure()) && (needs.LoadJobs_conf.outputs.do_FullBuild == 'true' ||
        needs.LoadJobs_conf.outputs.do_FuncTest == 'true' || needs.LoadJobs_conf.outputs.do_Glitch == 'true') &&
        (needs.LoadJobs_conf.outputs.do_MinBuild != 'true' || needs.MinBuild.result == 'success') }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      COMPILER: ${{ matrix.compiler }}
      TAR_CMD: tar
      GHA_OS: ubuntu-${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [22.04]
        compiler: ['gcc', 'clang']
        include:
        # Stock compilers are GCC 13 and Clang 18 on Ubuntu 24.04.
        - os: 24.04
          compiler: 'gcc'
        - os: 24.04
          compiler: 'clang'
        - os: 24.04
          compiler: 'gcc-9'
        - os: 24.04
          compiler: 'gcc-10'
        - os: 24.04
          compiler: 'gcc-11'
        - os: 24.04
          compiler: 'gcc-12'
        - os: 24.04
          compiler: 'gcc-14'
        - os: 24.04
          compiler: 'clang-14'
        - os: 24.04
          compiler: 'clang-15'
        - os: 24.04
          compiler: 'clang-16'
        - os: 24.04
          compiler: 'clang-17'
        - os: 24.04
          compiler: 'clang-19'
        - os: 24.04
          compiler: 'clang-20'
        # Stock compilers are GCC 15 and Clang 21 on Ubuntu 26.04.
        - os: 26.04
          compiler: 'gcc'
        - os: 26.04
          compiler: 'clang'
        - os: 26.04
          compiler: 'gcc-11'
        - os: 26.04
          compiler: 'gcc-12'
        - os: 26.04
          compiler: 'gcc-13'
        - os: 26.04
          compiler: 'gcc-14'
        - os: 26.04
          compiler: 'gcc-16'
        - os: 26.04
          compiler: 'clang-17'
        - os: 26.04
          compiler: 'clang-18'
        - os: 26.04
          compiler: 'clang-19'
        - os: 26.04
          compiler: 'clang-20'
        - os: 26.04
          compiler: 'clang-22'

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Build CI image with both test suites
      run: |
        docker build --file docker/Dockerfile.ci \
          --build-arg BASE_IMAGE=ubuntu:${{ matrix.os }} \
          --build-arg COMPILER=${{ matrix.compiler }} \
          --tag rtpproxy-ci:tests .

    - name: Save CI image
      run: |
        docker image inspect rtpproxy-ci:tests --format 'Uncompressed CI image size: {{.Size}} bytes'
        docker save rtpproxy-ci:tests | zstd -T0 -3 -c > "${RUNNER_TEMP}/rtpproxy-ci.tar.zst"
        du -h "${RUNNER_TEMP}/rtpproxy-ci.tar.zst"

    - name: Upload CI image
      uses: actions/upload-artifact@v7
      with:
        name: ci-image-${{ matrix.os }}-${{ matrix.compiler }}
        path: ${{ runner.temp }}/rtpproxy-ci.tar.zst
        compression-level: 0
        retention-days: 1
        overwrite: true

  FuncTest:
    name: Functional Testing    
    needs: [LoadJobs_conf, FullBuild]
    if: ${{ !cancelled() && (success() || failure()) && needs.LoadJobs_conf.outputs.do_FuncTest == 'true' &&
        needs.FullBuild.result == 'success' }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      COMPILER: ${{ matrix.compiler }}
      TAR_CMD: tar
      GHA_OS: ubuntu-${{ matrix.os }}

    # BEGIN GENERATED TEST OUTPUTS: FuncTest
    # Regenerate: python3 scripts/test-summary.py generate
    outputs:
      result_ubuntu_22_04_gcc: ${{ steps.summary.outputs.result_ubuntu_22_04_gcc }}
      result_ubuntu_22_04_clang: ${{ steps.summary.outputs.result_ubuntu_22_04_clang }}
      result_ubuntu_24_04_gcc: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc }}
      result_ubuntu_24_04_clang: ${{ steps.summary.outputs.result_ubuntu_24_04_clang }}
      result_ubuntu_24_04_gcc_9: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_9 }}
      result_ubuntu_24_04_gcc_10: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_10 }}
      result_ubuntu_24_04_gcc_11: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_11 }}
      result_ubuntu_24_04_gcc_12: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_12 }}
      result_ubuntu_24_04_gcc_14: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_14 }}
      result_ubuntu_24_04_clang_14: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_14 }}
      result_ubuntu_24_04_clang_15: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_15 }}
      result_ubuntu_24_04_clang_16: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_16 }}
      result_ubuntu_24_04_clang_17: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_17 }}
      result_ubuntu_24_04_clang_19: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_19 }}
      result_ubuntu_24_04_clang_20: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_20 }}
      result_ubuntu_26_04_gcc: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc }}
      result_ubuntu_26_04_clang: ${{ steps.summary.outputs.result_ubuntu_26_04_clang }}
      result_ubuntu_26_04_gcc_11: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_11 }}
      result_ubuntu_26_04_gcc_12: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_12 }}
      result_ubuntu_26_04_gcc_13: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_13 }}
      result_ubuntu_26_04_gcc_14: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_14 }}
      result_ubuntu_26_04_gcc_16: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_16 }}
      result_ubuntu_26_04_clang_17: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_17 }}
      result_ubuntu_26_04_clang_18: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_18 }}
      result_ubuntu_26_04_clang_19: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_19 }}
      result_ubuntu_26_04_clang_20: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_20 }}
      result_ubuntu_26_04_clang_22: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_22 }}
    # END GENERATED TEST OUTPUTS: FuncTest

    strategy:
      fail-fast: false
      matrix:
        os: [22.04]
        compiler: ['gcc', 'clang']
        include:
        # Stock compilers are GCC 13 and Clang 18 on Ubuntu 24.04.
        - os: 24.04
          compiler: 'gcc'
        - os: 24.04
          compiler: 'clang'
        - os: 24.04
          compiler: 'gcc-9'
        - os: 24.04
          compiler: 'gcc-10'
        - os: 24.04
          compiler: 'gcc-11'
        - os: 24.04
          compiler: 'gcc-12'
        - os: 24.04
          compiler: 'gcc-14'
        - os: 24.04
          compiler: 'clang-14'
        - os: 24.04
          compiler: 'clang-15'
        - os: 24.04
          compiler: 'clang-16'
        - os: 24.04
          compiler: 'clang-17'
        - os: 24.04
          compiler: 'clang-19'
        - os: 24.04
          compiler: 'clang-20'
        # Stock compilers are GCC 15 and Clang 21 on Ubuntu 26.04.
        - os: 26.04
          compiler: 'gcc'
        - os: 26.04
          compiler: 'clang'
        - os: 26.04
          compiler: 'gcc-11'
        - os: 26.04
          compiler: 'gcc-12'
        - os: 26.04
          compiler: 'gcc-13'
        - os: 26.04
          compiler: 'gcc-14'
        - os: 26.04
          compiler: 'gcc-16'
        - os: 26.04
          compiler: 'clang-17'
        - os: 26.04
          compiler: 'clang-18'
        - os: 26.04
          compiler: 'clang-19'
        - os: 26.04
          compiler: 'clang-20'
        - os: 26.04
          compiler: 'clang-22'

    steps:
    - uses: actions/checkout@v6

    - name: Download CI image
      uses: actions/download-artifact@v4
      with:
        name: ci-image-${{ matrix.os }}-${{ matrix.compiler }}
        path: ${{ runner.temp }}/ci-image

    - name: Start CI image
      run: |
        docker load --input "${RUNNER_TEMP}/ci-image/rtpproxy-ci.tar.zst"
        sudo sysctl -w kernel.core_pattern=core
        docker run --detach --name rtpproxy-tests --init \
          --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
          --workdir /opt/rtpproxy/basic rtpproxy-ci:tests

    - name: test
      id: tests
      run: docker exec rtpproxy-tests sh -x scripts/do-test.sh

    - name: Collect coverage
      run: |
        docker exec rtpproxy-tests sh -x scripts/collect-coverage.sh
        docker cp rtpproxy-tests:/opt/rtpproxy/basic/coverage .
        sed -i "s|^SF:/opt/rtpproxy/basic/|SF:${GITHUB_WORKSPACE}/|" coverage/lcov.info

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      env:
        TZ: UTC
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/lcov.info
        format: lcov
        flag-name: functest-${{ matrix.os }}-${{ matrix.compiler }}
        parallel: true

    - name: Copy test results
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      run: docker cp rtpproxy-tests:/opt/rtpproxy/basic/tests/test-suite.log tests/test-suite.log

    - name: Collect test summary
      id: summary
      if: ${{ always() }}
      env:
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        JOB_OUTCOME: ${{ job.status }}
      run: python3 scripts/test-summary.py collect --suite functional

    - name: Remove test container
      if: ${{ always() }}
      run: docker rm --force rtpproxy-tests 2>/dev/null || true

  Glitching:
    name: Glitch Injection
    needs: [LoadJobs_conf, FullBuild, FuncTest]
    if: ${{ !cancelled() && (success() || failure()) && needs.LoadJobs_conf.outputs.do_Glitch == 'true' && needs.FullBuild.result == 'success' &&
        (needs.LoadJobs_conf.outputs.do_FuncTest != 'true' || needs.FuncTest.result == 'success') }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      COMPILER: ${{ matrix.compiler }}
      TAR_CMD: tar
      GHA_OS: ubuntu-${{ matrix.os }}

    # BEGIN GENERATED TEST OUTPUTS: Glitching
    # Regenerate: python3 scripts/test-summary.py generate
    outputs:
      result_ubuntu_22_04_gcc: ${{ steps.summary.outputs.result_ubuntu_22_04_gcc }}
      result_ubuntu_22_04_clang: ${{ steps.summary.outputs.result_ubuntu_22_04_clang }}
      result_ubuntu_24_04_gcc: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc }}
      result_ubuntu_24_04_clang: ${{ steps.summary.outputs.result_ubuntu_24_04_clang }}
      result_ubuntu_24_04_gcc_9: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_9 }}
      result_ubuntu_24_04_gcc_10: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_10 }}
      result_ubuntu_24_04_gcc_11: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_11 }}
      result_ubuntu_24_04_gcc_12: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_12 }}
      result_ubuntu_24_04_gcc_14: ${{ steps.summary.outputs.result_ubuntu_24_04_gcc_14 }}
      result_ubuntu_24_04_clang_14: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_14 }}
      result_ubuntu_24_04_clang_15: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_15 }}
      result_ubuntu_24_04_clang_16: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_16 }}
      result_ubuntu_24_04_clang_17: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_17 }}
      result_ubuntu_24_04_clang_19: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_19 }}
      result_ubuntu_24_04_clang_20: ${{ steps.summary.outputs.result_ubuntu_24_04_clang_20 }}
      result_ubuntu_26_04_gcc: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc }}
      result_ubuntu_26_04_clang: ${{ steps.summary.outputs.result_ubuntu_26_04_clang }}
      result_ubuntu_26_04_gcc_11: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_11 }}
      result_ubuntu_26_04_gcc_12: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_12 }}
      result_ubuntu_26_04_gcc_13: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_13 }}
      result_ubuntu_26_04_gcc_14: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_14 }}
      result_ubuntu_26_04_gcc_16: ${{ steps.summary.outputs.result_ubuntu_26_04_gcc_16 }}
      result_ubuntu_26_04_clang_17: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_17 }}
      result_ubuntu_26_04_clang_18: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_18 }}
      result_ubuntu_26_04_clang_19: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_19 }}
      result_ubuntu_26_04_clang_20: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_20 }}
      result_ubuntu_26_04_clang_22: ${{ steps.summary.outputs.result_ubuntu_26_04_clang_22 }}
    # END GENERATED TEST OUTPUTS: Glitching

    strategy:
      fail-fast: false
      matrix:
        os: [22.04]
        compiler: ['gcc', 'clang']
        include:
        # Stock compilers are GCC 13 and Clang 18 on Ubuntu 24.04.
        - os: 24.04
          compiler: 'gcc'
        - os: 24.04
          compiler: 'clang'
        - os: 24.04
          compiler: 'gcc-9'
        - os: 24.04
          compiler: 'gcc-10'
        - os: 24.04
          compiler: 'gcc-11'
        - os: 24.04
          compiler: 'gcc-12'
        - os: 24.04
          compiler: 'gcc-14'
        - os: 24.04
          compiler: 'clang-14'
        - os: 24.04
          compiler: 'clang-15'
        - os: 24.04
          compiler: 'clang-16'
        - os: 24.04
          compiler: 'clang-17'
        - os: 24.04
          compiler: 'clang-19'
        - os: 24.04
          compiler: 'clang-20'
        # Stock compilers are GCC 15 and Clang 21 on Ubuntu 26.04.
        - os: 26.04
          compiler: 'gcc'
        - os: 26.04
          compiler: 'clang'
        - os: 26.04
          compiler: 'gcc-11'
        - os: 26.04
          compiler: 'gcc-12'
        - os: 26.04
          compiler: 'gcc-13'
        - os: 26.04
          compiler: 'gcc-14'
        - os: 26.04
          compiler: 'gcc-16'
        - os: 26.04
          compiler: 'clang-17'
        - os: 26.04
          compiler: 'clang-18'
        - os: 26.04
          compiler: 'clang-19'
        - os: 26.04
          compiler: 'clang-20'
        - os: 26.04
          compiler: 'clang-22'

    steps:
    - uses: actions/checkout@v6

    - name: Download CI image
      uses: actions/download-artifact@v4
      with:
        name: ci-image-${{ matrix.os }}-${{ matrix.compiler }}
        path: ${{ runner.temp }}/ci-image

    - name: Start CI image
      run: |
        docker load --input "${RUNNER_TEMP}/ci-image/rtpproxy-ci.tar.zst"
        sudo sysctl -w kernel.core_pattern=core
        docker run --detach --name rtpproxy-tests --init \
          --sysctl net.ipv4.ip_unprivileged_port_start=1024 \
          --security-opt seccomp=unconfined \
          --workdir /opt/rtpproxy/glitching rtpproxy-ci:tests

    - name: test
      id: tests
      run: docker exec rtpproxy-tests sh -x scripts/do-test.sh

    - name: Collect coverage
      run: |
        docker exec rtpproxy-tests sh -x scripts/collect-coverage.sh
        docker cp rtpproxy-tests:/opt/rtpproxy/glitching/coverage .
        sed -i "s|^SF:/opt/rtpproxy/glitching/|SF:${GITHUB_WORKSPACE}/|" coverage/lcov.info

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      env:
        TZ: UTC
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/lcov.info
        format: lcov
        flag-name: glitching-${{ matrix.os }}-${{ matrix.compiler }}
        parallel: true

    - name: Copy test results
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      run: docker cp rtpproxy-tests:/opt/rtpproxy/glitching/tests/test-suite.log tests/test-suite.log

    - name: Collect test summary
      id: summary
      if: ${{ always() }}
      env:
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        JOB_OUTCOME: ${{ job.status }}
      run: python3 scripts/test-summary.py collect --suite glitching

    - name: Collect glitch failure logs
      if: ${{ failure() && steps.tests.outcome == 'failure' }}
      run: |
        docker exec rtpproxy-tests sh -c \
          'cd /tmp && find . -maxdepth 1 -type d -name "glitch.*" -print0 | tar --null -T - -czf -' \
          > "${RUNNER_TEMP}/glitch-failures.tar.gz"

    - name: Upload glitch failure logs
      if: ${{ failure() && steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: glitch-failures-${{ matrix.os }}-${{ matrix.compiler }}
        path: ${{ runner.temp }}/glitch-failures.tar.gz

    - name: Remove test container
      if: ${{ always() }}
      run: docker rm --force rtpproxy-tests 2>/dev/null || true

  TestSummary:
    name: Combined Test Summary
    needs: [FuncTest, Glitching]
    if: ${{ always() && !cancelled() && (needs.FuncTest.result != 'skipped' || needs.Glitching.result != 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6

    - name: Publish combined test summary
      env:
        TEST_RESULTS: ${{ toJSON(needs) }}
      run: python3 scripts/test-summary.py render >> "$GITHUB_STEP_SUMMARY"

  Fuzzing:
    name: Fuzz with OSS-Fuzz
    needs: [LoadJobs_conf, Glitching]
    if: ${{ !cancelled() && (success() || failure()) && needs.LoadJobs_conf.outputs.do_Fuzzing == 'true' &&
        (needs.LoadJobs_conf.outputs.do_Glitch != 'true' || needs.Glitching.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, memory, coverage]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: Build Fuzzers (${{ matrix.sanitizer }})
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'rtpproxy'
        dry-run: false
        language: c
        sanitizer: ${{ matrix.sanitizer }}
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      env:
        OF_SANITIZER: ${{ matrix.sanitizer }}
      with:
        oss-fuzz-project-name: 'rtpproxy'
        fuzz-seconds: 1200
        dry-run: false
        parallel-fuzzing: true
        language: c
        sanitizer: ${{ matrix.sanitizer }}
        output-sarif: true
    - name: Collect fuzzing coverage
      if: matrix.sanitizer == 'coverage'
      run: sh -x scripts/fuzz/collect-coverage.sh
    - name: Upload fuzzing coverage to Coveralls
      if: matrix.sanitizer == 'coverage'
      uses: coverallsapp/github-action@v2
      env:
        TZ: UTC
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/lcov.info
        format: lcov
        flag-name: fuzzing-coverage
        parallel: true
    - name: Upload Crash
      uses: actions/upload-artifact@v7
      if: failure() && steps.build.outcome == 'success'
      with:
        name: ${{ matrix.sanitizer }}-artifacts
        path: ./out/artifacts
    - name: Upload Sarif
      if: always() && steps.build.outcome == 'success' && matrix.sanitizer != 'coverage'
      uses: github/codeql-action/upload-sarif@v4
      with:
        # Path to SARIF file relative to the root of the repository
        sarif_file: cifuzz-sarif/results.sarif
        checkout_path: cifuzz-sarif

  FinishCoverage:
    name: Finish Coveralls Build
    needs: [FuncTest, Glitching, Fuzzing]
    if: ${{ always() && (needs.FuncTest.result != 'skipped' ||
        needs.Glitching.result != 'skipped' || needs.Fuzzing.result != 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - name: Complete parallel coverage build
      uses: coverallsapp/github-action@v2
      env:
        TZ: UTC
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true

  Docker:
    name: Build&Push to DockerHub
    needs: [LoadJobs_conf, Fuzzing]
    if: ${{ !cancelled() && (success() || failure()) && needs.LoadJobs_conf.outputs.do_Docker == 'true' &&
        (needs.LoadJobs_conf.outputs.do_Fuzzing != 'true' || needs.Fuzzing.result == 'success') &&
        (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      CLANG_VER_NEW: 19
      CLANG_VER_OLD: 19
      DOCKER_REPO: sippylabs/rtpproxy
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}/rtpproxy
      LOCAL_REPO: localhost:5000/sippylabs/rtpproxy
      BASE_IMAGE: ${{ matrix.base_image }}
      CCACHE_ROOT: ccache
      DOCKER_RW: ${{ ( github.repository == 'sippy/rtpproxy' && github.event_name != 'pull_request' ) && 'true' || 'false' }}
      CCACHE_BIN_IMAGE: ghcr.io/sobomax/ccache:${{ matrix.ccache_bin_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - base_image: 'debian:12-slim'
          ccache_bin_image: 'latest-debian-12'
        - base_image: 'debian:13-slim'
          ccache_bin_image: 'latest-debian-13'
        - base_image: 'ubuntu:24.04'
          ccache_bin_image: 'latest-ubuntu-24.04'
        - base_image: 'ubuntu:latest'
          ccache_bin_image: 'latest-ubuntu-26.04'
    steps:
    - name: Maximize build space
      shell: sh -x -e {0}
      run: |
        echo "Memory and swap:"
        sudo free -h
        echo
        sudo swapon --show
        echo

        echo "Available storage:"
        sudo df -h
        echo

        PIDS=""
        for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        do
          sudo rm -rf "${d}" &
          PIDS="${PIDS} ${!}"
        done
        sudo docker image prune --all --force &
        PIDS="${PIDS} ${!}"
        for pid in ${PIDS}
        do
          wait ${pid}
        done

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: network=host

    - name: Log in to Docker Hub
      if: env.DOCKER_RW == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set dynamic environment
      run: |
        GIT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
        GIT_BRANCH="${GIT_BRANCH#refs/tags/}"
        echo "GIT_BRANCH=${GIT_BRANCH}" >> $GITHUB_ENV
        OS_TAG="`echo ${BASE_IMAGE} | sed 's|:|_|g'`"
        BRANCH_TAG="`echo ${GIT_BRANCH} | sed 's|/|_|g'`"
        if [ "${DOCKER_RW}" = "true" ]
        then
          CCACHE_IMAGE="${{ env.GHCR_REPO }}:${BRANCH_TAG}-${OS_TAG}-cccache"
        else
          CCACHE_IMAGE="${{ env.GHCR_REPO }}:master-${OS_TAG}-cccache"
        fi
        CACHE_SPEC="type=registry,ref=${CCACHE_IMAGE}"
        echo "CACHE_SPEC=${CACHE_SPEC}" >> $GITHUB_ENV
        if ! docker pull ${CCACHE_IMAGE} 2>&1 >/dev/null
        then
          CCACHE_BIMAGE="scratch"
        else
          CCACHE_BIMAGE="${CCACHE_IMAGE}"
        fi
        docker pull ${CCACHE_BIN_IMAGE}
        echo "BRANCH_TAG=${BRANCH_TAG}" >> $GITHUB_ENV
        echo "CCACHE_IMAGE=${CCACHE_IMAGE}" >> $GITHUB_ENV
        echo "CCACHE_BIMAGE=${CCACHE_BIMAGE}" >> $GITHUB_ENV
        echo "BUILD_IMAGE=${{ env.LOCAL_REPO }}:latest-${OS_TAG}" >> $GITHUB_ENV
        echo "LIBG722_IMAGE=sippylabs/libg722:latest-${OS_TAG}" >> $GITHUB_ENV
        PLATFORMS="`docker manifest inspect ${{ env.BASE_IMAGE }} | \
         jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant != null then "/\(.platform.variant)" else "" end)"' | \
         grep -v unknown | sort -u | paste -sd ','`"
        echo "PLATFORMS=${PLATFORMS}" >> $GITHUB_ENV
        echo "OS_TAG=${OS_TAG}" >> $GITHUB_ENV
        if [[ "${{ matrix.base_image }}" == debian:12* ]]
        then
          echo "LIBSSL_APKG=libssl3" >> $GITHUB_ENV
        else
          echo "LIBSSL_APKG=libssl3t64" >> $GITHUB_ENV
        fi
        if [ "${{ matrix.base_image }}" = "ubuntu:latest" -a "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]
        then
          echo "ADD_LATEST=true" >> "$GITHUB_ENV"
        else
          echo "ADD_LATEST=false" >> "$GITHUB_ENV"
        fi

    - name: Extract metadata (tags, labels) for Docker
      id: meta_dkr
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKER_REPO }}
        tags: |
          type=schedule,suffix=-${{ env.OS_TAG }}
          type=ref,event=branch,suffix=-${{ env.OS_TAG }}
          type=ref,event=tag,suffix=-${{ env.OS_TAG }}
          type=ref,event=pr,suffix=-${{ env.OS_TAG }}
          type=raw,value=latest-${{ env.OS_TAG }},enable={{is_default_branch}}
          type=sha,suffix=-${{ env.OS_TAG }}
          type=raw,value=latest,enable=${{ env.ADD_LATEST == 'true' }}

    - name: Extract metadata (tags, labels) for GHCR
      id: meta_ghcr
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.GHCR_REPO }}
        tags: |
          type=schedule,suffix=-${{ env.OS_TAG }}
          type=ref,event=branch,suffix=-${{ env.OS_TAG }}
          type=ref,event=tag,suffix=-${{ env.OS_TAG }}
          type=ref,event=pr,suffix=-${{ env.OS_TAG }}
          type=raw,value=latest-${{ env.OS_TAG }},enable={{is_default_branch}}
          type=sha,suffix=-${{ env.OS_TAG }}
          type=raw,value=latest,enable=${{ env.ADD_LATEST == 'true' }}

    - name: Build Docker image
      if: env.DOCKER_RW == 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        file: ./docker/Dockerfile
        build-args: |
          CLANG_VER_OLD=${{ env.CLANG_VER_OLD }}
          CLANG_VER_NEW=${{ env.CLANG_VER_NEW }}
          BASE_IMAGE=${{ env.BASE_IMAGE }}
          LIBG722_IMAGE=${{ env.LIBG722_IMAGE }}
          CCACHE_IMAGE=${{ env.CCACHE_BIMAGE }}
          CCACHE_BIN_IMAGE=${{ env.CCACHE_BIN_IMAGE }}
          CCACHE_ROOT=${{ env.CCACHE_ROOT }}
          LIBSSL_APKG=${{ env.LIBSSL_APKG }}
        tags: ${{ env.BUILD_IMAGE }}
        platforms: ${{ env.PLATFORMS }}
        push: true
        cache-from: ${{ env.CACHE_SPEC }}
        cache-to: ${{ env.CACHE_SPEC }},mode=max

    - name: Build Docker image (PR)
      if: env.DOCKER_RW != 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        file: ./docker/Dockerfile
        build-args: |
          CLANG_VER_OLD=${{ env.CLANG_VER_OLD }}
          CLANG_VER_NEW=${{ env.CLANG_VER_NEW }}
          BASE_IMAGE=${{ env.BASE_IMAGE }}
          LIBG722_IMAGE=${{ env.LIBG722_IMAGE }}
          CCACHE_IMAGE=${{ env.CCACHE_BIMAGE }}
          CCACHE_BIN_IMAGE=${{ env.CCACHE_BIN_IMAGE }}
          CCACHE_ROOT=${{ env.CCACHE_ROOT }}
          LIBSSL_APKG=${{ env.LIBSSL_APKG }}
        tags: ${{ env.BUILD_IMAGE }}
        platforms: ${{ env.PLATFORMS }}
        push: true
        cache-from: ${{ env.CACHE_SPEC }}

    - name: Export ccache
      if: env.DOCKER_RW == 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        file: ./docker/Dockerfile.export_ccache
        build-args: BUILD_IMAGE=${{ env.BUILD_IMAGE }}
        tags: ${{ env.CCACHE_IMAGE }}
        platforms: ${{ env.PLATFORMS }}
        push: true

    - name: Push Docker image
      if: env.DOCKER_RW == 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        file: ./docker/Dockerfile.push
        build-args: |
          BASE_IMAGE=${{ env.BASE_IMAGE }}
          BUILD_IMAGE=${{ env.BUILD_IMAGE }}
        push: true
        tags: |
          ${{ steps.meta_dkr.outputs.tags }}
          ${{ steps.meta_ghcr.outputs.tags }}
        labels: |
          ${{ steps.meta_dkr.outputs.labels }}
          ${{ steps.meta_ghcr.outputs.labels }}
        platforms: ${{ env.PLATFORMS }}

    - name: Update DockerHub repo description
      if: env.DOCKER_RW == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: sh -x docker/update_description.sh docker/README.md

  roll_release:
    name: Roll Release
    needs: [LoadJobs_conf, Docker, BuildPackages]
    permissions:
      contents: write
    uses: sippy/cimagic/.github/workflows/RollReleaseDraft.yml@v3
    with:
      release_files_artifacts: |
        ${{ needs.BuildPackages.outputs.dpkgs_artifacts }}
