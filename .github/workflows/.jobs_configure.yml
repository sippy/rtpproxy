name: Check Disabled Actions

on:
  workflow_call:
    outputs:
      do_Docker:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_Docker }}
      do_FullBuild:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_FullBuild }}
      do_FuncTest:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_FuncTest }}
      do_Fuzzing:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_Fuzzing }}
      do_Glitch:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_Glitch }}
      do_MinBuild:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_MinBuild }}
      do_BuildPackages:
        description: "Whether the current workflow should continue"
        value: ${{ jobs.check_disabled_actions.outputs.do_BuildPackages }}

      matrix_MinBuild:
        description: "OS/compiler pairs for MinBuild"
        value: ${{ jobs.check_disabled_actions.outputs.matrix_MinBuild }}
      matrix_FullBuild:
        description: "OS/compiler pairs for FullBuild"
        value: ${{ jobs.check_disabled_actions.outputs.matrix_FullBuild }}
      matrix_FuncTest:
        description: "OS/compiler pairs for FuncTest"
        value: ${{ jobs.check_disabled_actions.outputs.matrix_FuncTest }}
      matrix_Glitching:
        description: "OS/compiler pairs for Glitching"
        value: ${{ jobs.check_disabled_actions.outputs.matrix_Glitching }}

jobs:
  check_disabled_actions:
    name: Disabled Actions
    runs-on: ubuntu-latest
    outputs:
      do_Docker: ${{ steps.check_status.outputs.do_Docker }}
      do_FullBuild: ${{ steps.check_status.outputs.do_FullBuild }}
      do_FuncTest: ${{ steps.check_status.outputs.do_FuncTest }}
      do_Fuzzing: ${{ steps.check_status.outputs.do_Fuzzing }}
      do_Glitch: ${{ steps.check_status.outputs.do_Glitch }}
      do_MinBuild: ${{ steps.check_status.outputs.do_MinBuild }}
      do_BuildPackages: ${{ steps.check_status.outputs.do_BuildPackages }}
      matrix_MinBuild: ${{ steps.matrix.outputs.matrix_MinBuild }}
      matrix_FullBuild: ${{ steps.matrix.outputs.matrix_FullBuild }}
      matrix_FuncTest: ${{ steps.matrix.outputs.matrix_FuncTest }}
      matrix_Glitching: ${{ steps.matrix.outputs.matrix_Glitching }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Check disabled actions
      id: check_status
      run: |
        set -x
        DIS_FILE=".github/workflows.cfg"
        grep -v '#' ${DIS_FILE} >> $GITHUB_OUTPUT

    - name: Load build matrices
      id: matrix
      run: python3 scripts/ci_matrix.py >> "$GITHUB_OUTPUT"
